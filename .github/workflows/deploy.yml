name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-deploy:
    name: Build and Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'nudge/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: nudge/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: nudge/frontend
        run: npm run build

      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: nudge/frontend

  backend-deploy:
    name: Build and Deploy Backend (Render)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'nudge/backend/requirements.txt'

      - name: Install Backend Dependencies
        working-directory: nudge/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Syntax
        working-directory: nudge/backend
        run: |
          python -c "import main"

      - name: Trigger Render Deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Render Deploy Hook secret is missing. Skipping deployment..."
            exit 1
          fi
          echo "Triggering Render Deploy Hook..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
